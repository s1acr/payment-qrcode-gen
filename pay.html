<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>收款</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f6f8;--surface:#fff;--paper:#f3f4f6;
  --ink:#1c1d22;--ink-2:#5a5f68;--ink-3:#8b9099;
  --hairline:#e5e7eb;--hairline-strong:#d4d8de;
  --alipay:#1677ff;--wechat:#07c160;
  --warn-bg:#fbf3de;--warn-ink:#7a5f14
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(60% 42% at 12% -4%,rgba(22,119,255,.07),transparent 70%),radial-gradient(60% 42% at 88% -4%,rgba(7,193,96,.06),transparent 70%)}
.wrap{max-width:420px;width:100%;text-align:center}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:18px;padding:36px 26px;box-shadow:0 1px 2px rgba(28,29,34,.04),0 12px 32px rgba(16,24,40,.06)}
.spinner{width:40px;height:40px;border:3px solid var(--hairline);border-top-color:var(--ink);border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:19px;font-weight:650;margin-bottom:10px}
p{color:var(--ink-2);font-size:14px;line-height:1.75}
p strong{color:var(--ink);font-weight:600}
.qr-box{position:relative;margin:22px auto 0;padding:14px;background:#fff;border:1px solid var(--hairline);border-radius:14px;display:inline-block;line-height:0}
.qr-box::before{content:"";position:absolute;inset:7px;pointer-events:none;background:linear-gradient(rgba(28,29,34,.32),rgba(28,29,34,.32)) left top/12px 2px,linear-gradient(rgba(28,29,34,.32),rgba(28,29,34,.32)) left top/2px 12px,linear-gradient(rgba(28,29,34,.32),rgba(28,29,34,.32)) right top/12px 2px,linear-gradient(rgba(28,29,34,.32),rgba(28,29,34,.32)) right top/2px 12px,linear-gradient(rgba(28,29,34,.32),rgba(28,29,34,.32)) left bottom/12px 2px,linear-gradient(rgba(28,29,34,.32),rgba(28,29,34,.32)) left bottom/2px 12px,linear-gradient(rgba(28,29,34,.32),rgba(28,29,34,.32)) right bottom/12px 2px,linear-gradient(rgba(28,29,34,.32),rgba(28,29,34,.32)) right bottom/2px 12px;background-repeat:no-repeat}
.qr-box img,.qr-box canvas{display:block;width:240px;height:240px}
.tip{margin-top:18px;padding:11px 14px;background:var(--warn-bg);border-radius:10px;color:var(--warn-ink);font-size:13px;line-height:1.7;text-align:left}
.links{margin-top:24px;text-align:left}
.link-row{margin-bottom:16px}
.link-row .label{font-size:13px;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;gap:7px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.a{background:var(--alipay)}.dot.w{background:var(--wechat)}
.link-row .val{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:12px;word-break:break-all;background:var(--paper);border-radius:8px;padding:9px 11px;color:var(--ink-2);line-height:1.6}
.btn{display:inline-block;margin-top:9px;padding:8px 16px;font-size:13px;font-weight:500;border:1px solid var(--hairline-strong);background:var(--surface);border-radius:10px;color:var(--ink);cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s,color .15s}
.btn:active{background:var(--paper)}
.ok{color:var(--wechat);border-color:transparent}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:2.4s}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="card">
    <div class="spinner"></div>
    <h1>正在加载…</h1>
    <p>正在识别扫码环境</p>
  </div>
</div>
<script src="js/vendor/qrcode.min.js"></script>
<script src="js/pay.js"></script>
</body>
</html>
